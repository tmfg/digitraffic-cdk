services:
  db:
    image: mysql:8.0.46-debian@sha256:9382e4f6f7f013231049ab854de9d0810594d028f4237b67102acc7ade8e3a99
    platform: linux/x86_64
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"

  adminer:
    image: adminer
    ports:
      - 8080:8080

  flyway:
    image: flyway/flyway:12.11.0-alpine@sha256:6bf3a713f52c4d803a88501f8409dda2191e9ccba1454358a6de2c4cc65f71b0
    command: "-url=jdbc:mysql://db/${DB_DATABASE}?allowPublicKeyRetrieval=true -password=${DB_PASSWORD} -user=${DB_USER} -connectRetries=60 migrate"
    volumes:
      - ./sql:/flyway/sql
    depends_on:
      - db
