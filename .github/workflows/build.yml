name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  actions: read
  checks: write
  id-token: write
jobs:
  build:
    if: github.repository != 'tmfg/digitraffic-common'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Version is read automatically from "packageManager" field in package.json

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Compile
        run: |
          pnpm install
          pnpm build

      - name: Run tests
        run: |
          pnpm ci:test

      - name: Install madge
        run: npm -g install madge

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2

      - name: Run madge
        id: run-madge
        continue-on-error: true
        run: |
          # create image
          madge --image dependencies.svg dist
          # run for output
          madge --circular dist
          mkdir -p madge/${{ github.ref_name }}
          mv dependencies.svg madge/${{ github.ref_name }}/dependencies.svg

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: madge/

      - name: Publish report
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Step summary
        run: |
          echo "# Summary" >> $GITHUB_STEP_SUMMARY
          echo "[Madge report](${{ steps.deployment.outputs.page_url }}/${{ github.ref_name }}/dependencies.svg)" >> $GITHUB_STEP_SUMMARY

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: Jest test report
          reporter: jest-junit
          path: junit.xml
