name: Build, install and deploy to AWS

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: choice
        options:
          - "prod"
          - "test"
        default: "test"
      ref:
        description: "Branch/tag/SHA of digitraffic-cdk-private"
        required: true
        default: "master"
      config-repo-branch:
        description: "Branch or tag of CI-repo"
        required: true
        default: "master"
      command:
        description: "Command for cdk"
        required: true
        type: choice
        options: 
          - "deploy"
          - "diff"
        default: "deploy"
      skip_approval:
        description: "Deploy security-related changes without manual confirmation (cdk --require-approval never)"
        required: true
        type: boolean
        default: false

      application:
        description: "Application to install"
        required: true
        type: choice
        options: 
          - "marine/aton-faults"
          - "marine/marinecam"
          - "marine/port-call"
          - "marine/portactivity"
          - "marine/sea-state-estimate"
          - "marine/shiplight"
          - "marine/winter-navigation"
          - "other/digitraffic-statistics"
          - "other/os-key-figures"
          - "rail/data-dump"
          - "rail/rami"
          - "rail/yearly-plans"
          - "road/counting-site"
          - "road/data-upload"
          - "road/lam-history"
          - "road/maintenance-tracking"
          - "road/maintenance-tracking-municipality"
          - "road/roadnetwork"
          - "road/tmc"
          - "road/variable-signs"

jobs:
  log-parameters:
    if: ${{ github.repository != 'tmfg/digitraffic-cdk' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Log workflow inputs
        run: |
          echo "## Workflow Inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Name | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| env | ${{ github.event.inputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ref | ${{ github.event.inputs.ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| config-repo-branch | ${{ github.event.inputs.config-repo-branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| command | ${{ github.event.inputs.command }} |" >> $GITHUB_STEP_SUMMARY
          echo "| skip_approval | ${{ github.event.inputs.skip_approval }} |" >> $GITHUB_STEP_SUMMARY
          echo "| application | ${{ github.event.inputs.application }} |" >> $GITHUB_STEP_SUMMARY

  build_and_deploy:
    if: ${{ github.repository != 'tmfg/digitraffic-cdk' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    environment: ${{ github.event.inputs.env }}

    steps:
      - name: Summary
        run: |
          echo '### Running ${{ github.event.inputs.command }} ${{ github.event.inputs.application }} to ${{ github.event.inputs.env }}! 🚀' >> $GITHUB_STEP_SUMMARY
          echo 'Using ref ${{ github.event.inputs.ref }}' >> $GITHUB_STEP_SUMMARY
          echo 'Using ci ${{ github.event.inputs.config-repo-branch }}' >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Checkout CI-repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONFIG_REPO_NAME }}
          ssh-key: ${{ secrets.CONFIG_REPO_SSH_KEY }}
          ref: ${{ inputs.config-repo-branch }}
          path: digitraffic-ci

      - name: Read install config
        id: install-config
        run: |
            echo "config<<EOF" >> $GITHUB_OUTPUT
            cat digitraffic-ci/aws/cdk/install-config.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

      # install-config.json is still keyed by the bare project name (e.g. "tmc"), while the
      # dropdown above shows "domain/name" (e.g. "road/tmc") so it's clear what's being
      # installed. Strip everything up to the last "/" to get the key back.
      - name: Parse application name
        id: app
        run: |
            APP="${{ github.event.inputs.application }}"
            echo "name=${APP##*/}" >> $GITHUB_OUTPUT

      - name: Check config exists for ${{ github.event.inputs.application }}
        run: |
            export INSTALL_CONFIG="${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name] }}"
            if [ "$INSTALL_CONFIG" == "" ] || [ "$INSTALL_CONFIG" == "null" ]; then
              echo "Error: Application ${{ github.event.inputs.application }} not found in install config!"
              echo "Error: Application ${{ github.event.inputs.application }} not found in install config!" >> $GITHUB_STEP_SUMMARY

              exit 1
            fi;

      - name: Set environment variables for ${{ github.event.inputs.application }}
        id: environment
        run: |
            export INSTALL_CONFIG="${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name] }}"
            export DOMAIN="${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name].domain }}"
            export CONFIG_DIR="${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name].directory }}"

            # shared config.ts folder defaults to the domain, some projects (e.g.
            # digitraffic-statistics) override it via "directory" in install-config.json
            if [ "$CONFIG_DIR" == "" ]; then
                CONFIG_DIR=$DOMAIN
            fi;

            # handle multiline output
            echo "install_config<<EOF" >> $GITHUB_OUTPUT
            echo $INSTALL_CONFIG >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
            echo "stack=${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name].stack }}" >> $GITHUB_OUTPUT
            echo "dir=$CONFIG_DIR" >> $GITHUB_OUTPUT
            # The dropdown value is already the real repo-relative path, e.g. "road/tmc".
            echo "directory=${{ github.event.inputs.application }}" >> $GITHUB_OUTPUT
            echo "generate_sbom=${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name].runGenerateSbom }}" >> $GITHUB_OUTPUT
            echo "skip_sbom_upload=${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name].skipSbomUpload }}" >> $GITHUB_OUTPUT
            echo "skip_environment_on_stack_name=${{ fromJson(steps.install-config.outputs.config).projects[steps.app.outputs.name].skipEnvironmentOnStackName }}" >> $GITHUB_OUTPUT

      - name: Read SBOM config
        id: sbom-config
        run: |
            if [ ! -f "digitraffic-ci/aws/sbom/${{ steps.environment.outputs.domain }}.json" ]; then
              echo "Error: SBOM config for domain ${{ steps.environment.outputs.domain }} not found!"
              echo "Error: SBOM config for domain ${{ steps.environment.outputs.domain }} not found!" >> $GITHUB_STEP_SUMMARY

              exit 1
            fi;

            echo "config<<EOF" >> $GITHUB_OUTPUT
            cat digitraffic-ci/aws/sbom/${{ steps.environment.outputs.domain }}.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "common<<EOF" >> $GITHUB_OUTPUT
            cat digitraffic-ci/aws/sbom/config.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ fromJson(steps.install-config.outputs.config).roles[github.event.inputs.env][steps.environment.outputs.domain] }}
          role-session-name: gh-actions-install-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm 10
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 10

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.3.2

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Install Rush command-line tools
        run: node common/scripts/install-run-rush.js update-autoinstaller --name rush-command-line-tools

      - name: Copy config
        id: copy-config
        env:
          BIN_DIR: ${{ steps.environment.outputs.directory }}/src/bin
        run: |
            mkdir -p "$BIN_DIR"

            if [ "${{ steps.environment.outputs.install_config.allConfigs }}" == "true" ]; then
              cp digitraffic-ci/aws/cdk/marine/config.ts $BIN_DIR/config-marine.ts 
              cp digitraffic-ci/aws/cdk/road/config.ts $BIN_DIR/config-road.ts 
              cp digitraffic-ci/aws/cdk/rail/config.ts $BIN_DIR/config-rail.ts 
              cp digitraffic-ci/aws/cdk/aviation/config.ts $BIN_DIR/config-aviation.ts 
            else
              # file might not exist, so skipping errors 
              cp "digitraffic-ci/aws/cdk/${{ steps.environment.outputs.dir }}/config.ts" "$BIN_DIR/" || true
            fi;

            cp -r "digitraffic-ci/aws/cdk/${{ steps.environment.outputs.directory }}/"* "$BIN_DIR/"

      - name: Diff and deploy
        id: deploy
        env:
          ENV: ${{ github.event.inputs.env }}
          STACK: ${{ steps.environment.outputs.stack }}
          COMMAND: ${{ github.event.inputs.command }}
          SKIP_APPROVAL: ${{ github.event.inputs.skip_approval }}
        run: |
            if [ "$ENV" == "prod" ]; then export STACK_NAME=${STACK}Prod; else export STACK_NAME=${STACK}Test; fi;
 
            # skip environment suffix on stack name if configured
            if [ "true" == "${{ steps.environment.outputs.skip_environment_on_stack_name }}" ]; then
                export STACK_NAME=${STACK}
            fi;

            node common/scripts/install-run-rush.js rebuild --to ${{ steps.app.outputs.name }}

            # --require-approval is only accepted by deploy, not by diff
            export CDK_ARGS=""
            if [ "$COMMAND" == "deploy" ] && [ "$SKIP_APPROVAL" == "true" ]; then
                export CDK_ARGS="--require-approval never"
            fi;

            cd ${{ steps.environment.outputs.directory }}
            # and the run command
            node ../../common/scripts/install-run-rush-pnpm.js cdk $COMMAND $STACK_NAME $CDK_ARGS

            if [ "${{ steps.environment.outputs.generate_sbom }}" == "true" ] && [ "${{ github.event.inputs.command }}" == "deploy" ]; then
              export IMAGE_URL=$(aws cloudformation describe-stacks \
                --region ${{ secrets.AWS_REGION }} \
                --stack-name $STACK_NAME \
                --query "Stacks[0].Outputs[?OutputKey=='ImageUrl'].OutputValue" \
                --output text)

              echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_OUTPUT
            fi;

      - name: Generate SBOM
        if: github.event.inputs.command == 'deploy' && steps.environment.outputs.generate_sbom == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 #v0.24.0
        env:
          SYFT_FILE_METADATA_SELECTION: "none"
        with:
          image: ${{ steps.deploy.outputs.IMAGE_URL }}
          format: cyclonedx-json
          output-file: ${{ steps.environment.outputs.directory }}/sbom.json

      - name: Configure AWS credentials for SBOM
        if: github.event.inputs.command == 'deploy' && steps.environment.outputs.skip_sbom_upload != 'true'
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ fromJson(steps.sbom-config.outputs.common).sbomUploadRoleArn }}
          role-session-name: gh-actions-upload-sbom-${{ steps.app.outputs.name }}-${{ github.event.inputs.env }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload SBOM
        if: github.event.inputs.command == 'deploy' && steps.environment.outputs.skip_sbom_upload != 'true'
        run: |          
          aws s3 cp ${{ steps.environment.outputs.directory }}/sbom.json \
            s3://${{ fromJson(steps.sbom-config.outputs.common).bucketArn }}/${{ fromJson(steps.sbom-config.outputs.config)[github.event.inputs.env][steps.app.outputs.name] }}/${{ github.run_id }}-${{ github.sha }}.json

